# =============================================================================
# .github/workflows/ci.yml
#
# What this does, in plain terms:
#   Every time someone opens a Pull Request (or pushes to main), GitHub spins
#   up a clean virtual machine, checks out this exact code, and runs a series
#   of checks against it. If any check fails, the PR is blocked from merging
#   (once you turn on branch protection — see the note at the bottom).
#
# Checks included:
#   1. gitleaks   -> scans the diff for committed secrets (the .env.local
#                    incident you found earlier is exactly what this catches)
#   2. build      -> npm ci, next lint, tsc --noEmit, next build
#
# IMPORTANT — before using this file:
#   The action versions below are pinned to REAL, verified commit SHAs as of
#   Aug 2026. Never trust a SHA you didn't personally verify against the tag
#   it claims to be.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Global default: no permissions. Each job below grants only the specific
# scope it actually needs (contents: read), instead of inheriting broad
# read-all access to scopes like issues, packages, and security-events that
# none of these jobs touch.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Secret scanning
  # Catches committed API keys, tokens, passwords, .env files, etc. before
  # they land in history. This is the automated version of what you did
  # manually with `git log -p -- .env.local` earlier in this conversation.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history, gitleaks needs it to scan past commits)
        # Verified SHA for actions/checkout v4.3.0 (resolved 2026-08-28)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit
          persist-credentials: false

      - name: Run gitleaks
        # Verified SHA for gitleaks/gitleaks-action v2.x (resolved 2026-08-28)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 2: Build, lint, type-check
  # Fails the PR if the app doesn't actually build, or has lint/type errors.
  # ---------------------------------------------------------------------------
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # Verified SHA for actions/setup-node v4.x (resolved 2026-08-28)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (locked, reproducible)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        run: npx next build

  # ---------------------------------------------------------------------------
  # JOB 3: Dependency vulnerability check
  # Fails on known-vulnerable packages in package-lock.json.
  # No external action needed — npm has this built in.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # Verified SHA for actions/setup-node v4.x — same SHA as job above
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for known vulnerabilities
        # --audit-level=high: fail only on high/critical, so low-severity noise
        # doesn't block every PR. Tighten this once the backlog is clean.
        run: npm audit --audit-level=high

# =============================================================================
# NEXT STEPS after adding this file:
#
# 1. Run zizmor against this file locally before pushing, to confirm the
#    artipacked and excessive-permissions findings are resolved:
#      zizmor .github/workflows/ci.yml
#
# 2. Push this on a branch, open a PR, confirm all 3 jobs run and pass.
#
# 3. Once confirmed working: Settings -> Branches -> Branch protection rules
#    -> main -> "Require status checks to pass before merging" -> add
#    secret-scan, build, and dependency-audit as required checks.
#    This is what actually makes it enforceable, not just informational.
#
# 4. Add Dependabot so these action SHAs get automatic update PRs instead of
#    going stale (create .github/dependabot.yml — ask me for this next).
# =============================================================================
