# =============================================================================
# .github/workflows/ci.yml
#
# Every PR (and every push to main) triggers a clean VM that checks out this
# exact code and runs three checks. If any fails, the PR is blocked from
# merging once branch protection is turned on (see bottom of file).
#
#   1. secret-scan       -> gitleaks CLI scans full history for committed secrets
#   2. build              -> npm ci, tsc --noEmit, eslint, next build
#   3. dependency-audit   -> npm audit for known-vulnerable packages (informational
#                            for now — see note near that job)
#
# Verified SHAs (resolved by user via gh api, 2026-08-28):
#   actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955   (v4.3.0)
#   actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  (v4)
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No global permissions. Each job below grants only what it actually needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Secret scanning
  # Uses the free open-source gitleaks CLI directly (gitleaks-action requires
  # a paid license for organization-owned repos — Qubo-LLC is an org, so we
  # avoid that requirement entirely by not using the wrapped Action).
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history, gitleaks needs it to scan past commits)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks (CLI, no license required)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --verbose

  # ---------------------------------------------------------------------------
  # JOB 2: Build, lint, type-check
  # Fails the PR if the app doesn't actually build, or has lint/type errors.
  # ---------------------------------------------------------------------------
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (locked, reproducible)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build

  # ---------------------------------------------------------------------------
  # JOB 3: Dependency vulnerability check
  # NOTE: continue-on-error is set TEMPORARILY. As of 2026-08-28 this repo has
  # 6 known high-severity findings (brace-expansion, js-yaml, nanoid, next.js,
  # postcss, sharp). Full remediation requires a Next.js major-version bump
  # (16.2.1 -> 16.3.3), which needs its own reviewed PR, not a silent CI fix.
  # Tracked in a separate GitHub issue. Once resolved, remove
  # continue-on-error below to make this a real blocking gate again.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true   # TEMP: see note above job definition

# =============================================================================
# NEXT STEPS:
#
# 1. Run zizmor .github/workflows/ci.yml locally to confirm it's still clean.
#
# 2. Commit and push (see chat for exact commands), push to the existing
#    add-ci-pipeline branch, and let the PR re-run automatically.
#
# 3. Once all 3 jobs pass (dependency-audit will show yellow/warn but not
#    block), merge the PR.
#
# 4. Settings -> Branches -> Branch protection rules -> main ->
#    "Require status checks to pass before merging" -> add secret-scan,
#    build, and dependency-audit as required checks.
#
# 5. File a tracked issue for the Next.js major-version upgrade (see chat
#    for the gh issue create command), then remove continue-on-error once
#    that's resolved.
#
# 6. Add Dependabot (.github/dependabot.yml) so the two pinned SHAs above
#    get automatic update PRs instead of going stale.
# =============================================================================
