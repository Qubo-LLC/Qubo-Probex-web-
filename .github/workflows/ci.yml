# =============================================================================
# .github/workflows/ci.yml
#
# Every PR (and every push to main) triggers a clean VM that checks out this
# exact code and runs three checks. All three are blocking: if any fails, the
# PR is blocked from merging once branch protection is turned on (see bottom).
#
#   1. secret-scan       -> gitleaks CLI scans full history for committed secrets
#   2. build             -> npm ci, tsc --noEmit, eslint, next build
#   3. dependency-audit  -> npm audit for known-vulnerable packages
#
# Verified SHAs (resolved via the GitHub API, re-verified 2026-08-30):
#   actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955   (v4.3.0)
#   actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  (v4.4.0, also tagged v4)
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No global permissions. Each job below grants only what it actually needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Secret scanning
  # Uses the free open-source gitleaks CLI directly (gitleaks-action requires
  # a paid license for organization-owned repos — Qubo-LLC is an org, so we
  # avoid that requirement entirely by not using the wrapped Action).
  #
  # The version and its checksum are pinned. Resolving "latest" at runtime made
  # every run depend on whatever gitleaks published that day, which is both
  # non-reproducible and a supply-chain risk. Pinning also keeps .gitleaksignore
  # valid: those entries are fingerprints (commit:path:rule:line), and rule IDs
  # can change between gitleaks releases.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout (full history, gitleaks needs it to scan past commits)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Run gitleaks
        # --redact keeps any finding out of the job log. This repository is
        # public, so Actions logs are public: an unredacted --verbose run would
        # print a newly-detected secret in plaintext to a world-readable log.
        # Exits non-zero on any finding, so this step blocks the PR.
        run: ./gitleaks detect --source . --verbose --redact --gitleaks-ignore-path .gitleaksignore

  # ---------------------------------------------------------------------------
  # JOB 2: Build, lint, type-check
  # Fails the PR if the app doesn't build, or has lint or type errors.
  # ---------------------------------------------------------------------------
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (locked, reproducible)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        # Blocking. Runs eslint.config.mjs (eslint-config-next flat config).
        run: npm run lint

      - name: Build
        run: npx next build

  # ---------------------------------------------------------------------------
  # JOB 3: Dependency vulnerability check
  # Blocking. The six high-severity findings that made this advisory
  # (brace-expansion, js-yaml, nanoid, next, postcss, sharp) were remediated by
  # the Next.js 16.2.1 -> 16.3.3 upgrade plus in-range transitive fixes;
  # npm audit now reports 0 vulnerabilities.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high

# =============================================================================
# NEXT STEPS:
#
# 1. Run zizmor .github/workflows/ci.yml locally to confirm it's still clean.
#
# 2. Settings -> Branches -> Branch protection rules -> main ->
#    "Require status checks to pass before merging" -> add secret-scan,
#    build, and dependency-audit as required checks (do this only after a
#    green run on a PR).
#
# 3. Add Dependabot (.github/dependabot.yml) so the two pinned action SHAs and
#    the pinned gitleaks version above get automatic update PRs instead of
#    going stale.
# =============================================================================
